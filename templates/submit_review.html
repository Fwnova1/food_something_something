{% extends "base.html" %}

{% block title %}Review {{ product.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card card-soft p-4 fade-stagger">
            <h3 class="mb-3">Write Review</h3>
            <p class="text-muted mb-3">Order #{{ order.id }} | {{ product.name }}</p>
            <form method="post" class="d-grid gap-3">
                {% csrf_token %}
                <div>
                    <label class="form-label" for="{{ form.rating.id_for_label }}">Rating (1-5)</label>
                    {{ form.rating }}
                </div>
                <div>
                    <label class="form-label" for="{{ form.title.id_for_label }}">Title</label>
                    {{ form.title }}
                </div>
                <div>
                    <label class="form-label" for="{{ form.comment.id_for_label }}">Comment</label>
                    {{ form.comment }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Submit Review</button>
                    <a href="{% url 'order_detail' order.id %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
