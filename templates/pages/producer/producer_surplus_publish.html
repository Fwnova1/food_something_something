{% extends "base.html" %}
{% block title %}Publish Surplus Offer{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl rounded-2xl border border-emerald-100 bg-white p-6 shadow-card"><h2 class="font-display text-3xl text-brand-700">Publish Surplus Offer</h2><form method="post" class="mt-4 grid gap-4 md:grid-cols-12">{% csrf_token %}<div class="md:col-span-6"><label class="mb-1 block text-sm font-semibold">Product</label><select name="product_id" required><option value="">Select product</option>{% for product in producer_products %}<option value="{{ product.id }}">{{ product.name }} ({{ product.stock_quantity }})</option>{% endfor %}</select></div><div class="md:col-span-3"><label class="mb-1 block text-sm font-semibold">Discount %</label><input type="number" name="discount_percent" min="1" max="90" required></div><div class="md:col-span-3"><label class="mb-1 block text-sm font-semibold">Expires At</label><input type="datetime-local" name="expires_at" required></div><div class="md:col-span-12"><label class="mb-1 block text-sm font-semibold">Message</label><textarea name="message" rows="3"></textarea></div><div class="md:col-span-12"><button class="rounded-xl bg-brand-600 px-4 py-2 font-semibold text-white">Publish</button></div></form></div>
{% endblock %}
