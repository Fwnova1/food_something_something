{% extends "base.html" %}

{% block content %}

<h2>Products</h2>

<div class="mb-3">

<form method="GET">

<select name="category" class="form-select">

<option value="">All Categories</option>

{% for category in categories %}

<option value="{{ category.id }}">
{{ category.name }}
</option>
{% endfor %}

</select>

<button class="btn btn-primary mt-2">
Filter
</button>

</form>

</div>

<div class="row">

{% for product in products %}

<div class="col-md-4">

<div class="card mb-3">

{% if product.image %} <img src="{{ product.image.url }}" class="card-img-top">
{% endif %}

<div class="card-body">

<h5>{{ product.name }}</h5>

<p>{{ product.price }}</p>

<a href="/products/{{ product.id }}/"
class="btn btn-primary">

View

</a>

</div>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
