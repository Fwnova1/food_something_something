{% extends "base.html" %}

{% block title %}Products - Local Food Marketplace{% endblock %}

{% block content %}
<div class="card card-soft p-3 p-md-4 mb-4 fade-stagger">
    <div class="section-head mb-3">
        <h2 class="mb-0"><i class="fas fa-apple-alt text-success me-2"></i>Our Fresh Products</h2>
        <span class="badge-soft">Fresh picks daily</span>
    </div>
    <form method="GET" class="row g-2 align-items-center">
        <div class="col-md-6">
            <input
                type="search"
                name="q"
                class="form-control"
                placeholder="Search products..."
                value="{{ search_query }}"
            >
        </div>
        <div class="col-md-3">
            <select name="category" class="form-select">
                <option value="">All Categories</option>
                {% for category in categories %}
                <option value="{{ category.id }}" {% if request.GET.category == category.id|stringformat:"s" %}selected{% endif %}>
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3 d-flex flex-wrap gap-2">
            <div class="form-check align-self-center me-2">
                <input class="form-check-input" type="checkbox" name="organic" id="organicOnly" value="1" {% if organic_only %}checked{% endif %}>
                <label class="form-check-label" for="organicOnly">Organic only</label>
            </div>
            <button class="btn btn-success w-100" type="submit">
                <i class="fas fa-search me-1"></i>Search
            </button>
            {% if search_query or request.GET.category %}
            <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">Clear</a>
            {% endif %}
        </div>
    </form>
</div>

<div>
    {% include "partials/product_grid.html" %}
</div>
{% endblock %}
